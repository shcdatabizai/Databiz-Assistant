# =============================================================
# weekly_news_crawl.yml — 데이터뉴스(기능3) 주간 자동 수집
# 매일 UTC 22:00 (= KST 07:00)에 실행하고, 실제 수집 여부는
# 관리자 화면(/admin/news)에 저장한 수집 주기(기본 매주 월요일)를 따릅니다.
# workflow_dispatch는 주기와 관계없이 즉시 실행합니다.
#
# 결과는 git에 커밋하지 않고 Supabase(news_weeks/news_articles)에 바로 저장합니다.
# NAVER_CLIENT_ID/SECRET, ANTHROPIC_API_KEY는 /admin/api-keys에 등록된 값을
# 스크립트가 Supabase에서 직접 조회 + 복호화해서 사용하므로 여기 secrets로 넣지 않습니다.
# =============================================================

name: Weekly Data News Crawl

on:
  schedule:
    - cron: '0 22 * * *'
  workflow_dispatch:

jobs:
  crawl-and-save:
    runs-on: ubuntu-latest

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 의존성 설치
        run: pip install -r scripts/requirements.txt

      - name: 뉴스 수집 실행
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          API_KEY_ENCRYPTION_SECRET: ${{ secrets.API_KEY_ENCRYPTION_SECRET }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python scripts/news_crawl.py --force
          else
            python scripts/news_crawl.py
          fi
